<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>夢シルク AR デモ</title>
  <!-- A-Frame + MindAR (image tracking) from CDN. The phone needs internet. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    /* no background color here: the live camera picture sits behind the page */
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: sans-serif; }
    #start {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; color: #fff; text-align: center;
      background: #5c1e28; padding: 24px; box-sizing: border-box;
    }
    #start h1 { margin: 0; font-size: 34px; color: #ffd678; }
    #start p { margin: 0; font-size: 16px; line-height: 1.6; }
    #go {
      font-size: 20px; padding: 14px 36px; border: none; border-radius: 30px;
      background: #ffd678; color: #5c1e28; font-weight: bold;
    }
    #status { font-size: 14px; min-height: 20px; color: #ffe; }
    #dl { color: #ffd678; font-size: 13px; display: none; }

    /* dark shade: above the camera picture (z -2), below the AR video (canvas) */
    #shade {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: rgba(0,0,0,.45); transition: background .4s;
    }
    #shade.playing { background: rgba(0,0,0,.65); }

    /* ---- guide: shown when the label is not seen ---- */
    #guide { position: fixed; inset: 0; z-index: 10; display: none; pointer-events: none; }
    #frame {
      position: absolute; left: 50%; top: 45%; width: 68vw; max-width: 420px; aspect-ratio: 3 / 2;
      transform: translate(-50%, -50%); animation: pulse 1.6s ease-in-out infinite;
    }
    #frame img { width: 100%; height: 100%; object-fit: cover; opacity: .35; border-radius: 8px; display: block; }
    .c { position: absolute; width: 30px; height: 30px; border: 5px solid #ffd678; }
    .tl { left: -8px; top: -8px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
    .tr { right: -8px; top: -8px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
    .bl { left: -8px; bottom: -8px; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
    .br { right: -8px; bottom: -8px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }
    @keyframes pulse { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.05); } }

    #arrow { position: absolute; left: 50%; top: 45%; width: 96px; height: 96px; margin: -48px 0 0 -48px; display: none; }
    #arrow svg { width: 100%; height: 100%; animation: nudge .8s ease-in-out infinite; filter: drop-shadow(0 0 6px rgba(0,0,0,.7)); }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(16px); } }

    #gtext {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 90vw;
      background: rgba(0,0,0,.65); color: #fff; padding: 10px 18px; border-radius: 20px;
      font-size: 15px; line-height: 1.5; text-align: center;
    }
  </style>
</head>
<body>
  <div id="start">
    <h1>夢シルク</h1>
    <p>ラベルにスマホをかざすと、<br>動画が商品の上で再生されます。</p>
    <button id="go" style="display:none">スタート / Start</button>
    <div id="status">カメラを準備中… / Starting camera…</div>
    <a id="dl" download="targets.mind">targets.mind を保存</a>
  </div>

  <div id="shade"></div>

  <div id="guide">
    <div id="frame">
      <img src="./label.jpg" alt="" />
      <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
    </div>
    <div id="arrow">
      <svg viewBox="0 0 100 100"><path d="M10 38 H58 V18 L92 50 L58 82 V62 H10 Z" fill="#ffd678" stroke="#5c1e28" stroke-width="4" stroke-linejoin="round"/></svg>
    </div>
    <div id="gtext"></div>
  </div>

  <a-scene id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiScanning: no; uiLoading: no"
    color-space="sRGB" renderer="colorManagement: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <video id="vid" src="./demo.mp4" preload="auto" muted playsinline webkit-playsinline loop crossorigin="anonymous"></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <!-- label is 1200 x 800 (width 1, height 0.667). Video is 16:9 → height 0.5625 -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane src="#vid" width="1" height="0.5625" position="0 0 0.01"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const statusEl = document.getElementById("status");
    const video = document.getElementById("vid");
    const scene = document.getElementById("scene");
    const target = document.getElementById("target");
    const goBtn = document.getElementById("go");
    const guide = document.getElementById("guide");
    const frame = document.getElementById("frame");
    const arrow = document.getElementById("arrow");
    const gtext = document.getElementById("gtext");
    const shade = document.getElementById("shade");
    const CACHE_KEY = "yumesilk-mind-v1";

    const TXT_POINT = "ラベルにカメラを向けてください<br>Point the camera at the label";
    const TXT_ARROW = "矢印の方へスマホを動かしてください<br>Move your phone toward the arrow";

    // Turn a buffer into a blob URL that MindAR can fetch
    const toUrl = (buf) => URL.createObjectURL(new Blob([buf], { type: "application/octet-stream" }));
    const toB64 = (buf) => { let s = ""; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); };
    const fromB64 = (str) => { const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b.buffer; };

    // 1) use targets.mind if it exists, 2) else use a saved copy, 3) else build it from label.jpg on the phone
    async function getTargetUrl() {
      try {
        const r = await fetch("./targets.mind", { cache: "no-store" });
        if (r.ok) return "./targets.mind";
      } catch (e) {}
      try {
        const saved = localStorage.getItem(CACHE_KEY);
        if (saved) return toUrl(fromB64(saved));
      } catch (e) {}

      statusEl.textContent = "ラベルを準備中… (初回のみ 10〜60秒)";
      const img = new Image();
      img.src = "./label.jpg";
      await img.decode();
      const compiler = new window.MINDAR.IMAGE.Compiler();
      await compiler.compileImageTargets([img], (p) => {
        statusEl.textContent = "ラベルを準備中… " + Math.round(p) + "%";
      });
      const buf = compiler.exportData();
      try { localStorage.setItem(CACHE_KEY, toB64(buf)); } catch (e) {}
      const url = toUrl(buf);
      const dl = document.getElementById("dl");
      dl.href = url; dl.style.display = "inline";
      return url;
    }

    // ---------- Guide (frame + arrow) ----------
    // While the label is tracked, remember where it is on the screen.
    // When it is lost, the arrow points to where it was going.
    let tracking = false;
    let history = [];          // last screen positions of the label
    let arrowTimer = null;

    function labelOnScreen() {
      const THREE = AFRAME.THREE;
      const v = new THREE.Vector3();
      target.object3D.getWorldPosition(v);
      v.project(scene.camera);
      return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight, t: performance.now() };
    }

    function loop() {
      if (tracking && scene.camera) {
        try {
          history.push(labelOnScreen());
          if (history.length > 12) history.shift();
        } catch (e) {}
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function showGuide() {
      guide.style.display = "block";
      frame.style.display = "block";
      arrow.style.display = "none";
      gtext.innerHTML = TXT_POINT;
      clearTimeout(arrowTimer);

      const last = history[history.length - 1];
      if (!last || performance.now() - last.t > 1500) return;   // no recent data → frame only

      // guess where the label went: last position + its recent movement
      let x = last.x, y = last.y;
      const first = history[0];
      const dt = last.t - first.t;
      if (dt > 30) { x += (last.x - first.x) / dt * 250; y += (last.y - first.y) / dt * 250; }

      const cx = innerWidth / 2, cy = innerHeight * 0.45;
      const dx = x - cx, dy = y - cy;
      const small = Math.min(innerWidth, innerHeight);
      if (Math.hypot(dx, dy) < small * 0.15) return;          // label was in the middle → frame only

      const angle = Math.atan2(dy, dx);
      arrow.style.transform = "rotate(" + angle + "rad) translateX(" + (small * 0.3) + "px)";
      arrow.style.display = "block";
      frame.style.display = "none";
      gtext.innerHTML = TXT_ARROW;

      // after 4 s the guess is old → go back to the frame
      arrowTimer = setTimeout(() => {
        if (!tracking) { arrow.style.display = "none"; frame.style.display = "block"; gtext.innerHTML = TXT_POINT; }
      }, 4000);
    }

    function hideGuide() {
      clearTimeout(arrowTimer);
      guide.style.display = "none";
    }

    // ---------- Start AR (runs by itself) ----------
    let started = false;
    async function startAR() {
      if (started) return;
      started = true;
      goBtn.style.display = "none";
      statusEl.textContent = "カメラを準備中… / Starting camera…";
      // the video is muted, so phones allow it to play without a tap
      video.muted = true;
      try { await video.play(); video.pause(); } catch (err) {}
      try {
        const url = await getTargetUrl();
        const ar = scene.systems["mindar-image-system"];
        ar.imageTargetSrc = url;
        await ar.start();
        document.getElementById("start").style.display = "none";
        showGuide();
      } catch (err) {
        // backup: if the phone blocks auto start, show the button
        started = false;
        statusEl.textContent = "タップして開始 / Tap to start";
        goBtn.style.display = "inline-block";
      }
    }

    if (scene.renderStarted) startAR();
    else scene.addEventListener("renderstart", startAR);
    goBtn.addEventListener("click", startAR);

    // play on the label, pause when the camera moves away
    target.addEventListener("targetFound", () => {
      tracking = true; history = [];
      video.play(); hideGuide();
      shade.classList.add("playing");      // darker while the video plays
    });
    target.addEventListener("targetLost", () => {
      tracking = false;
      video.pause(); showGuide();
      shade.classList.remove("playing");
    });
  </script>
</body>
</html>
